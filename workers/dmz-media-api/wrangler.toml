name = "dmz-media-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "dmz_media"
database_id = "47d73216-f4d9-4831-a207-4548ccad9244"

[vars]
# Optional: comma-separated list of allowed origins.
ALLOWED_ORIGINS = "https://dmzscuba-com.pages.dev,https://dmzscuba.com,http://localhost:8080,http://127.0.0.1:8080"
RESEND_FROM_EMAIL = "no-reply@dmzscuba.com"
RESEND_FROM_NAME = "DMZ Scuba"
RESEND_TO = "info@dmzscuba.com"
# Optional: Resend template IDs for API-driven template sends.
# Set in dashboard vars/secrets to manage email design in Resend without Worker code edits.
# RESEND_TEMPLATE_CATALINA = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_ROATAN = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_PLAYA = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_MERMET = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_HAIGH = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_KEY_LARGO = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# RESEND_TEMPLATE_COZUMEL = "tmpl_xxxxxxxxxxxxx"
# RESEND_TEMPLATE_INTEREST_DEFAULT = "tmpl_xxxxxxxxxxxxx"
# Cloudflare Images (set via dashboard/vars or secrets)
# CF_IMAGES_TOKEN = ""
# CF_IMAGES_ACCOUNT_ID = ""
# CF_IMAGES_DELIVERY = "<your-images-hash-or-delivery-url>"
# CF_IMAGES_VARIANT = "public"
